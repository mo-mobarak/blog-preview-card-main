<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog Preview Card</title>
    <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@500;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="container">
        <article class="card">
           <img src="assets/images/illustration-article.svg" alt="Card Illustration" class="card-img">
           <span class="tag">Learning</span>
           <p class="publish-date">Published 21 Dec 2023</p>
           <h1 class="card-title"><a href="#" >HTML & CSS foundations</a></h1>
           <p class="card-desc">These languages are the backbone of every website, defining structure, content, and presentation.</p>
           <footer class="author-info">
            <img src="assets/images/image-avatar.webp" alt="Greg Hooper" class="avatar">
            <span class="author-name">Grege Hooper</span>
           </footer>
        </article>
    </main>
</body>
</html>
